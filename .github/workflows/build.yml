name: Build HPWatcher.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Import check
        run: python -c "import hp_watcher, settings_ui, mss, keyboard, pydirectinput, numpy, tkinter; print('imports ok', hp_watcher.VERSION)"

      - name: Build exe
        run: python -m PyInstaller --noconfirm --onefile --uac-admin --hidden-import settings_ui --name HPWatcher hp_watcher.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/HPWatcher | Out-Null
          Copy-Item dist/HPWatcher.exe out/HPWatcher/
          # config.json не кладём: распаковка обновления затирала бы настройки пользователя.
          # Программа сама создаёт его при первом запуске.
          Copy-Item README.md out/HPWatcher/
          Get-ChildItem out/HPWatcher | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: HPWatcher
          path: out/HPWatcher
          retention-days: 30

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = python -c "import hp_watcher; print(hp_watcher.VERSION)"
          $tag = "v$ver-build$env:GITHUB_RUN_NUMBER"
          Compress-Archive -Path out/HPWatcher -DestinationPath HPWatcher.zip -Force
          gh release create $tag HPWatcher.zip out/HPWatcher/HPWatcher.exe `
            --title "HP Watcher $ver (сборка $env:GITHUB_RUN_NUMBER)" `
            --notes "Скачайте HPWatcher.zip, распакуйте и запустите HPWatcher.exe. Python не нужен." `
            --latest
