name: Build HPWatcher.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Import check
        run: python -c "import hp_watcher, mss, keyboard, pydirectinput, numpy, tkinter; print('imports ok', hp_watcher.VERSION)"

      - name: Build exe
        run: python -m PyInstaller --noconfirm --onefile --uac-admin --name HPWatcher hp_watcher.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/HPWatcher | Out-Null
          Copy-Item dist/HPWatcher.exe out/HPWatcher/
          Copy-Item config.json, README.md out/HPWatcher/
          Get-ChildItem out/HPWatcher | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: HPWatcher
          path: out/HPWatcher
          retention-days: 30
